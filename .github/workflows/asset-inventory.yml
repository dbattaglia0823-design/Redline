name: Project asset inventory
on:
  push:
    branches:
      - maintenance/remove-unused-project-assets
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Audit tracked assets, models and folder references
        run: python3 tools/audit_repository_assets.py
      - name: Upload review report
        uses: actions/upload-artifact@v4
        with:
          name: project-asset-inventory
          path: .qa/asset_inventory.json
          if-no-files-found: error
